modeling_notes:
- >-
  Identifiers are unprefixed integers or opaque strings — customer_profile_id 492,
  tag_id 321, media_id "1234-abcd-7890", guid "101". There is no type-prefixed ID
  convention, so an ID alone does not identify its entity.
- >-
  guid is reused as the identifier for both PostAnalytics and Message. It is also the
  documented cursor field for paging past the 10,000-result ceiling.
- >-
  The PublishingPost create response does not mirror the request: one create fans out to
  one calendar post per profile per scheduled time, and the response represents the
  future network posts rather than the calendar entry. Two profiles by two send times
  returns four objects.
- >-
  Publishing silently drops profiles whose media type is unsupported — no error is
  returned. A caller must diff the requested customer_profile_ids against the response
  to detect it.
