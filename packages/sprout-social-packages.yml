source: >-
  registry.npmjs.org (search + per-package metadata endpoints), pypi.org,
  rubygems.org, https://github.com/sproutsocial, https://api.sproutsocial.com/docs/
name: Sprout Social published packages
description: >-
  Sprout Social publishes no first-party client library for its Public API in any
  language. What it does publish, and publishes actively, is Seeds — its open design
  system — as ~60 MIT-licensed npm packages under the @sproutsocial scope, plus Racine,
  its React component library. These are UI packages, not API clients: none of them
  wraps api.sproutsocial.com. Versions and publish dates below were read from the npm
  registry metadata endpoint.

api_client_sdks:
  count: 0
  note: >-
    No official Sprout Social API SDK exists on npm, PyPI, RubyGems, Maven Central,
    NuGet, pkg.go.dev, Packagist or crates.io. pypi.org/pypi/sproutsocial,
    /sprout-social and /sprout_social all return HTTP 404. The GitHub org
    (github.com/sproutsocial, 68 public repos) contains forks of third-party OSS
    (NSQ, ROME, restfb, Twitter4J, swagger-ui) and internal tooling, but no Sprout API
    client. Integrators are expected to call the REST API directly with an HTTP client.
    The only published integration convenience is a Tableau Web Data Connector at
    https://api.sproutsocial.com/tableau/, which is a hosted connector rather than a
    distributable package.

