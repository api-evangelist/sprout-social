gaps:
- >-
  No first-party API client library in any language. This is the single largest developer
  ergonomics gap in the profile — an Advanced-plan customer paying for API access must
  hand-roll HTTP, auth-token refresh, the expression-string filter grammar and two
  different pagination styles.
- No CLI is published.
- No public Postman collection or workspace was found; api.sproutsocial.com/docs/postman/
  returns HTTP 404 and the word "Postman" does not appear in the reference.
