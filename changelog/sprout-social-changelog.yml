description: >-
  Dated change entries for the Sprout Social Public API, transcribed from the provider's
  published changelog. The changelog is Sprout's only deprecation notice channel — there
  is no deprecation policy page and no Deprecation/Sunset response headers — so it is
  the authoritative record of what was removed and when.

