entries:
- date: '2026-06-15'
  breaking: true
  type: deprecation
  highlights:
  - Facebook profile metrics deprecated upstream by Meta and no longer supported —
    impressions_nonviral_unique, impressions_paid_unique, impressions_viral_unique,
    post_impressions, post_impressions_nonviral, post_impressions_paid,
    post_impressions_viral, video_views_unique.
  - Facebook post metrics deprecated — lifetime.impressions_nonviral_unique,
    lifetime.impressions_organic_unique, lifetime.impressions_paid_unique,
    lifetime.impressions_viral_unique, lifetime.video_views_organic_unique,
    lifetime.video_views_paid_unique, lifetime.video_views_unique.

- date: '2026-06-10'
  breaking: false
  type: addition
  highlights:
  - Added support for TIKTOK_POST_MENTION and TIKTOK_COMMENT_MENTION post types on the
    messages endpoint.

- date: '2026-05-12'
  breaking: false
  type: documentation
  highlights:
  - Documented that no Listening message-level data is available from Reddit following
    Reddit compliance changes.

- date: '2026-04-15'
  breaking: false
  type: addition
  highlights:
  - Added publishing_post_id to Message Fields on the messages endpoint, returning the
    Sprout Publishing Calendar post ID for sent messages published through the Sprout
    publishing workflow.

- date: '2026-04-08'
  breaking: false
  type: addition
  highlights:
  - Added lifetime.video_view_time and lifetime.video_view_time_per_view to Instagram
    post metrics.

- date: '2026-01-13'
  breaking: false
  type: addition
  highlights:
  - Added network_metadata to the customer profile metadata endpoints
    (v1/{customerId}/metadata/customer and v2/{customerId}/metadata/customer),
    carrying network-specific metadata such as address and store_code.

- date: '2025-12-05'
  breaking: false
  type: documentation
  highlights:
  - Clarified clickthrough_link support — not supported for Instagram, YouTube, Threads
    or TikTok; LinkedIn limitations clarified.

- date: '2025-12-03'
  breaking: false
  type: documentation
  highlights:
  - Added notes about the Facebook metric deprecations that occurred on 2025-11-15.
  - Added Bluesky to the supported Listening networks.

- date: '2025-11-26'
  breaking: false
  type: addition
  highlights:
  - Documented the from.guid filtering option on the messages endpoint.

- date: '2025-09-15'
  breaking: false
  type: addition
  highlights:
  - Added lifetime.post_shares_count for Threads, Facebook, LinkedIn, Instagram,
    YouTube and TikTok.

- date: '2025-09-03'
  breaking: false
  type: addition
  highlights:
  - LinkedIn personal profiles and posts are now supported on the Analytics endpoints.

- date: '2025-08-29'
  breaking: false
  type: addition
  highlights:
  - Added TikTok to the supported Listening networks.

- date: '2025-08-11'
  breaking: false
  type: addition
  highlights:
  - Documented Bluesky posts and post metrics.

- date: '2025-08-05'
  breaking: false
  type: addition
  highlights:
  - Added the name field to customer metadata returned by GET /v1/metadata/client.

- date: '2025-07-23'
  breaking: false
  type: addition
  highlights:
  - Added the email field to user metadata returned by the customer users metadata
    endpoint.
  - Documented the language_code field on the messages endpoint.

- date: '2025-07-21'
  breaking: false
  type: addition
  highlights:
  - Documented the document.theme_ids filter for topic messages.

- date: '2025-07-14'
  breaking: false
  type: addition
  highlights:
  - Documented the is_boosted field on posts.

- date: '2025-06-23'
  breaking: true
  type: deprecation
  highlights:
  - Removed references to Facebook Groups, which are deprecated upstream.

- date: '2025-06-04'
  breaking: false
  type: documentation
  highlights:
  - Updated Public API access documentation covering API token management, OAuth token
    generation and the EULA acceptance flow.

- date: '2025-05-30'
  breaking: false
  type: documentation
  highlights:
  - Documented availability requirements for Public API metrics.

- date: '2025-05-02'
  breaking: false
  type: addition
  highlights:
