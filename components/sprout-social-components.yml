description: >-
  Seeds is Sprout Social's public, open-source design system: documented at
  seeds.sproutsocial.com and distributed as MIT-licensed npm packages under the
  @sproutsocial scope. It is a client-side UI component and design-token library for
  building interfaces, not an embedded surface for the Sprout API — none of these
  components talks to api.sproutsocial.com, and Sprout publishes no embeddable widget,
  hosted iframe or embedded dashboard for its API product.

