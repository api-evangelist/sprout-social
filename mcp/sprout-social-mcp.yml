sprout_owned_mcp_repos:
- name: sproutsocial/java-mcp-sdk
  url: https://github.com/sproutsocial/java-mcp-sdk
  kind: protocol-sdk-fork
  description: >-
    Sprout Social fork of the official Java SDK for Model Context Protocol servers and
    clients, maintained in collaboration with Spring AI.
  is_sprout_api_server: false

note: >-
  No candidate tool list is derived here. Sprout publishes no OpenAPI to ground
  operationIds in, and inventing tool names against a hand-read endpoint table would
  produce a manifest indistinguishable from a real one. The honest record is that the
  documented REST surface — customer metadata, analytics, listening, messages,
  publishing, media and cases — is what any future MCP server would wrap.

no_pointer_reason: >-
  Deliberately NOT wired as type MCPServer in apis.yml. Sprout Social serves no MCP
  endpoint and ships no MCP package; a pointer would assert an agent surface that does
  not exist.
