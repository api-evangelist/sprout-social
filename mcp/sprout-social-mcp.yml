name: Sprout Social MCP posture
description: >-
  Sprout Social does not ship an MCP server. There is no hosted MCP endpoint, no
  first-party stdio package, and no mention of MCP, agents or tools anywhere in the API
  reference. The only Sprout-owned MCP artifact is a fork of the upstream Java MCP SDK
  in its GitHub org — a contribution to the protocol's tooling, not a Sprout agent
  surface. Every MCP server that speaks to the Sprout API is third-party and
  self-declared unofficial.

deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched

server: null
tools: []

evidence:
- check: API reference searched for "MCP", "agent", "tool"
  url: https://api.sproutsocial.com/docs/
  http_status: 200
  result: no occurrences
- check: GitHub organization repository listing (68 public repos)
  url: https://api.github.com/orgs/sproutsocial/repos
  http_status: 200
  result: >-
    No Sprout MCP server. One related repo — sproutsocial/java-mcp-sdk, described as
    "Sprout Social Fork of the official Java SDK for Model Context Protocol servers and
    clients. Maintained in collaboration with Spring AI." That is a fork of the protocol
    SDK, not a server exposing Sprout's own API.
- check: npm registry search for a first-party server
  url: https://registry.npmjs.org/-/v1/search?text=sprout%20social
  http_status: 200
  result: >-
    Four MCP packages found, none published under the @sproutsocial scope and none
    first-party.
- check: '/.well-known/oauth-protected-resource on the API host (MCP auth discovery)'
  url: https://api.sproutsocial.com/.well-known/oauth-protected-resource
  http_status: 404

